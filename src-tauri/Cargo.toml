[package]
name = "nexus-optimizer"
version = "1.1.0"
description = "Otimizador de desempenho para Windows, honesto e reversível"
authors = ["carlosguilhe"]
edition = "2024"
license = "MIT"
repository = "https://github.com/carlosguilhe/Nexus-Optimizer"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexus_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
winreg = "0.55"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3.34"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["time", "net"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system", "disk"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

